# Container image for the server, built from docker/Dockerfile for linux/amd64 and linux/arm64. A published release (not a
# draft) pushes it to ghcr.io/<owner>/re-psn; a manual run (workflow_dispatch) builds both platforms and pushes nothing unless
# its push input is true: the dry run. Permissions: read at the top; write on packages only for the job that pushes.
# Tags pushed: X.Y.Z for every release; X.Y and latest only for a release that is not a pre-release (every 0.x release is one,
# so none of them is "latest"). The tag must be v + VERSION (scripts/check-release.sh --tag). The package starts private under
# a user account: its visibility is a setting on GitHub, changed by hand, and the image's source label links it to this repo.
# Checks: the amd64 image starts and reports the version before anything is pushed. Not checked: the image on arm64 (built
# under emulation, not run), signing, provenance.
name: container
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to build, such as v0.2.0
        required: true
      push:
        description: Push the image (build only unless true)
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: container-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
      PUSH: ${{ github.event_name == 'release' || inputs.push }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version: stable
      - name: Tag is v + VERSION
        run: scripts/check-release.sh --tag "$TAG"
      - name: Image name and tags
        id: img
        env:
          PRERELEASE: ${{ github.event.release.prerelease || 'true' }}
        run: |
          version="$(tr -d '\r\n' < VERSION)"
          name="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/re-psn"
          tags="$name:$version"
          if [ "$PRERELEASE" != "true" ]; then
            tags="$tags,$name:${version%.*},$name:latest"
          fi
          {
            echo "name=$name"
            echo "version=$version"
            echo "tags=$tags"
            echo "revision=$(git rev-parse HEAD)"
          } >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1  # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4.4.1
      - name: Build the amd64 image and start it
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64
          load: true
          push: false
          tags: re-psn-smoke:${{ steps.img.outputs.version }}
      - name: Smoke test
        env:
          VERSION: ${{ steps.img.outputs.version }}
        run: |
          docker run -d --name smoke "re-psn-smoke:$VERSION"
          sleep 3
          docker logs smoke 2>&1 | tee smoke.log
          docker rm -f smoke > /dev/null
          grep -q "version=$VERSION" smoke.log
          docker run --rm --entrypoint id "re-psn-smoke:$VERSION" -u | grep -qx 10001
      - name: Log in to ghcr.io
        if: env.PUSH == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build both platforms (pushes only when PUSH is true)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ env.PUSH == 'true' }}
          tags: ${{ steps.img.outputs.tags }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.img.outputs.version }}
            org.opencontainers.image.revision=${{ steps.img.outputs.revision }}
            org.opencontainers.image.licenses=MIT
            org.opencontainers.image.description=re-psn matchmaking and leaderboard server for recompiled PS3 titles
