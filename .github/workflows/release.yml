# Release build for the fork. A pushed tag vMAJOR.MINOR.PATCH builds the archives and creates a DRAFT PRE-RELEASE for the
# maintainer to publish; this workflow never publishes. A manual run (workflow_dispatch) only builds and keeps the archives
# as a run artifact: the dry run. Permissions: read at the top; write only on the job that creates the draft.
# Checks here: vet and tests, the tag shape, SHA256SUMS verified, and that no release for the tag exists yet.
# Not checked here: that the binaries run on Windows or arm64 (they are cross-built), signing (the exe is unsigned).
name: release
on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TAG: ${{ github.ref_type == 'tag' && github.ref_name || 'v0.0.0' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version: stable
      - name: vet and test
        run: |
          go vet ./...
          go test -race -count=1 ./...
      - name: Build archives and checksums
        run: scripts/release-build.sh "$TAG"
      - name: Release notes
        run: |
          {
            echo "## $TAG"
            echo
            echo "Pre-release: this is a 0.x version and may change without notice."
            echo
            echo "### Changes"
            sed -n '/^## \[Unreleased\]/,/^## \[/p' CHANGELOG.md | sed '1d;$d'
            echo
            echo "### Files"
            echo
            echo "Each archive holds one self-contained server binary (no installer, no runtime needed), LICENSE and NOTICE.md."
            echo "Check a download with \`sha256sum -c SHA256SUMS\`."
            echo
            echo '```'
            cat dist/SHA256SUMS
            echo '```'
            echo
            echo "Developed with AI agent assistance."
            echo
            echo "Next planned release: to be set by the maintainer when publishing."
          } > dist/notes.md
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: release-${{ env.TAG }}
          path: dist/
          if-no-files-found: error
          retention-days: 14

  draft:
    if: github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: release-${{ github.ref_name }}
          path: dist
      - name: Verify the checksums again
        run: cd dist && sha256sum -c SHA256SUMS
      - name: Create the draft pre-release
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::a release for $TAG already exists; not overwriting"; exit 1
          fi
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --verify-tag --draft --prerelease \
            --title "$TAG" --notes-file dist/notes.md \
            dist/psnr-* dist/SHA256SUMS
