# nginx in front of psnr: the stream module passes the game TCP port with PROXY protocol v1, so psnr sees the real player
# address. NOT RUN: written from nginx's documentation, not tested here. Include this at the top level of nginx.conf
# (not inside http {}). Set on psnr: PSNR_TRUSTED_PROXIES=<the address nginx connects from>  PSNR_PROXY_PROTOCOL=true
# UDP is not proxied: publish UDP straight to the psnr host.
stream {
    server {
        listen 36100;
        proxy_pass 127.0.0.1:36200;      # psnr's TCP address: PSNR_TCP_ADDR=127.0.0.1:36200, so both fit on one host
        proxy_protocol on;               # sends PROXY protocol v1 (psnr accepts v1 and v2); v2 needs a recent nginx, check its docs
    }
}

