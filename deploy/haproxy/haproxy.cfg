# HAProxy in front of psnr: TCP mode with send-proxy-v2, so psnr sees the real player address. NOT RUN: written from
# HAProxy's documentation, not tested here. Set on psnr: PSNR_TRUSTED_PROXIES=<the address HAProxy connects from>
# PSNR_PROXY_PROTOCOL=true. UDP is not proxied: publish UDP straight to the psnr host.
# psnr listens behind HAProxy on 36200: PSNR_TCP_ADDR=127.0.0.1:36200, so both fit on one host.
defaults
    mode tcp
    timeout connect 5s
    timeout client  5m
    timeout server  5m

frontend game
    bind :36100
    default_backend psnr

backend psnr
    server psnr 127.0.0.1:36200 send-proxy-v2
