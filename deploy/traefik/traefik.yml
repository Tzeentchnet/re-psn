# Traefik static configuration for psnr. Entry points: "game" for the game TCP port and "web" for the status page.
# Tested with Traefik 3.1 under Podman (see README.md). Change the ports here and in dynamic.yml together.
entryPoints:
  game:
    address: ":36100"
  web:
    address: ":36101"
providers:
  file:
    filename: /etc/traefik/dynamic.yml
log:
  level: INFO
